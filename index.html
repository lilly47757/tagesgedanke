const A = {
  "Epiktet": ["um 50 – um 138 n. Chr.", "Griechischer Stoiker", "Als Sklave in Hierapolis geboren, später freigelassen. Er gründete in Nikopolis eine Philosophenschule. Selbst schrieb er nichts; sein Schüler Arrian hielt seine Lehrgespräche fest. Sein Kerngedanke: Frei ist, wer unterscheiden kann, was in seiner Macht steht und was nicht."],
  "Seneca": ["um 1 v. Chr. – 65 n. Chr.", "Römischer Stoiker und Dramatiker", "Philosoph, Schriftsteller und Erzieher des jungen Kaisers Nero, später einer der reichsten Männer Roms. Nero zwang ihn zum Suizid. Seine Briefe über Zeit, Tod und Freundschaft gehören bis heute zu den meistgelesenen Texten der Antike."],
  "Marc Aurel": ["121 – 180 n. Chr.", "Römischer Kaiser und Stoiker", "Regierte das Römische Reich von 161 bis 180, oft aus Feldlagern an der Donau. Abends schrieb er auf Griechisch Notizen an sich selbst, nie für die Öffentlichkeit gedacht. Er gilt als Inbegriff des Philosophen auf dem Thron."],
  "Sokrates": ["469 – 399 v. Chr.", "Athener Philosoph", "Schrieb kein einziges Wort; wir kennen ihn vor allem aus den Dialogen seines Schülers Platon. Er verwickelte Menschen auf dem Marktplatz in Gespräche, die ihr vermeintliches Wissen erschütterten. Wegen Gottlosigkeit und Verführung der Jugend wurde er zum Tod durch den Schierlingsbecher verurteilt."],
  "Heraklit": ["um 520 – um 460 v. Chr.", "Vorsokratiker aus Ephesos", "Schon in der Antike „der Dunkle“ genannt, weil er bewusst rätselhaft schrieb. Für ihn ist alles in ständigem Wandel, zusammengehalten von einer verborgenen Ordnung, dem Logos. Von seinem Buch sind nur rund 130 Fragmente erhalten."],
  "Aristoteles": ["384 – 322 v. Chr.", "Griechischer Philosoph", "Schüler Platons, Lehrer Alexanders des Großen und Gründer einer eigenen Schule, des Lykeion. Er schrieb über fast alles: Logik, Ethik, Politik, Biologie, Physik, Dichtkunst. Über 1500 Jahre lang war er schlicht „der Philosoph“."],
  "Diogenes von Sinope": ["um 412 – 323 v. Chr.", "Kyniker", "Lebte in Athen angeblich in einem großen Tonfass und besaß fast nichts. Mit provokanten Auftritten verspottete er Konventionen, Reichtum und Macht. Sein Ideal war ein Leben, so bedürfnislos und natürlich wie das eines Hundes, daher der Name „Kyniker“."],
  "Epikur": ["341 – 270 v. Chr.", "Griechischer Philosoph", "Gründete in Athen eine Gemeinschaft namens „der Garten“, die auch Frauen und Sklaven offenstand. Glück bedeutet für ihn nicht Schwelgen, sondern Freiheit von Schmerz und innere Ruhe. Freundschaft hielt er für das größte Gut."],
  "Cicero": ["106 – 43 v. Chr.", "Römischer Redner und Staatsmann", "Der berühmteste Redner Roms, Konsul im Jahr 63 v. Chr. In politisch erzwungenen Pausen übertrug er griechische Philosophie ins Lateinische und prägte dabei viele Begriffe, die wir heute noch benutzen. Er wurde auf Betreiben Marcus Antonius’ ermordet."],
  "Horaz": ["65 – 8 v. Chr.", "Römischer Dichter", "Sohn eines Freigelassenen, später Dichter im Kreis des Kaisers Augustus. Seine Oden, Satiren und Briefe verbinden Lebensklugheit mit Leichtigkeit. Von ihm stammen „carpe diem“ und „sapere aude“."],
  "Augustinus": ["354 – 430", "Kirchenvater", "Geboren im heutigen Algerien, nach einer wilden Jugend und langer Suche Christ geworden, später Bischof von Hippo. Seine „Bekenntnisse“ gelten als erste große Autobiografie der Weltliteratur. Kaum ein Denker hat die christliche Philosophie so stark geprägt."],
  "Laozi": ["der Überlieferung nach 6. Jh. v. Chr.", "Legendärer Begründer des Daoismus", "Ob es Laozi wirklich gab, ist unklar; „Laozi“ heißt einfach „alter Meister“. Der Legende nach schrieb er das Daodejing, als er China auf einem Wasserbüffel verließ und ein Grenzwächter ihn um seine Lehre bat."],
  "Konfuzius": ["551 – 479 v. Chr.", "Chinesischer Philosoph", "Lehrer aus dem Staat Lu, der zeitlebens vergeblich einen Herrscher suchte, der seine Ideen umsetzt. Er lehrte Menschlichkeit, Pflichtbewusstsein, Respekt und lebenslanges Lernen. Seine Gedanken prägen Ostasien bis heute."],
  "Zhuangzi": ["um 369 – um 286 v. Chr.", "Daoistischer Philosoph", "Neben Laozi die wichtigste Stimme des Daoismus, aber viel verspielter: Er denkt in Gleichnissen, Witzen und Paradoxien. Berühmt ist sein Traum, ein Schmetterling zu sein, nach dem er nicht mehr wusste, ob nicht der Schmetterling von ihm träumt."],
  "Thích Nhất Hạnh": ["1926 – 2022", "Vietnamesischer Zen-Mönch", "Setzte sich während des Vietnamkriegs für Frieden ein und wurde dafür ins Exil gezwungen. In Frankreich gründete er das Kloster Plum Village. Er hat Achtsamkeit im Westen bekannt gemacht wie kaum ein anderer."],
  "René Descartes": ["1596 – 1650", "Französischer Philosoph und Mathematiker", "Gilt als Vater der neuzeitlichen Philosophie. Er zweifelte methodisch an allem, bis nur eine Gewissheit übrig blieb: dass er denkt. Nebenbei erfand er das Koordinatensystem, das nach ihm „kartesisch“ heißt."],
  "Blaise Pascal": ["1623 – 1662", "Französischer Mathematiker und Denker", "Baute als Jugendlicher eine der ersten Rechenmaschinen und begründete die Wahrscheinlichkeitsrechnung mit. Nach einem religiösen Erweckungserlebnis widmete er sich dem Glauben. Er starb mit 39 Jahren."],
  "Baruch de Spinoza": ["1632 – 1677", "Niederländischer Philosoph", "Wurde mit 23 Jahren wegen seiner Ansichten aus der jüdischen Gemeinde Amsterdams verstoßen. Er verdiente sein Geld als Linsenschleifer und lehnte eine Professur ab, um frei denken zu können. Für ihn sind Gott und Natur ein und dasselbe."],
  "Michel de Montaigne": ["1533 – 1592", "Französischer Schriftsteller", "Zog sich mit 38 Jahren in den Turm seines Schlosses zurück, um zu lesen und über sich selbst zu schreiben. Daraus wurde eine neue Gattung: der Essay. Sein Motto war „Que sais-je?“, „Was weiß ich?“."],
  "Voltaire": ["1694 – 1778", "Französischer Aufklärer", "Eigentlich François-Marie Arouet. Er kämpfte mit Witz und Spott gegen Intoleranz, Kirchenmacht und Justizwillkür und saß dafür zweimal in der Bastille. Er war der berühmteste Intellektuelle seiner Zeit."],
  "Jean-Jacques Rousseau": ["1712 – 1778", "Genfer Philosoph", "Behauptete, der Mensch sei von Natur aus gut und werde erst durch die Gesellschaft verdorben. Seine Ideen zu Volkssouveränität und Erziehung beeinflussten die Französische Revolution und die moderne Pädagogik."],
  "Francis Bacon": ["1561 – 1626", "Englischer Philosoph und Staatsmann", "Lordkanzler unter Jakob I. und Vordenker der modernen Naturwissenschaft. Er forderte, Wissen nicht aus alten Büchern, sondern aus Beobachtung und Experiment zu gewinnen."],
  "David Hume": ["1711 – 1776", "Schottischer Philosoph", "Der große Skeptiker der Aufklärung: Er zeigte, dass wir Ursache und Wirkung nie direkt beobachten, sondern nur aus Gewohnheit annehmen. Kant schrieb, Hume habe ihn aus seinem „dogmatischen Schlummer“ geweckt."],
  "Immanuel Kant": ["1724 – 1804", "Deutscher Philosoph", "Verließ seine Heimatstadt Königsberg fast nie und soll so pünktlich spazieren gegangen sein, dass man die Uhr nach ihm stellte. Mit seinen drei „Kritiken“ veränderte er die Philosophie grundlegend. Er ist die zentrale Figur der Aufklärung."],
  "G. W. F. Hegel": ["1770 – 1831", "Deutscher Philosoph", "Georg Wilhelm Friedrich Hegel, Professor in Berlin und zu Lebzeiten der einflussreichste Philosoph Deutschlands. Er sah Geschichte als Prozess, in dem der Geist durch Widersprüche hindurch zu sich selbst und zur Freiheit kommt."],
  "Arthur Schopenhauer": ["1788 – 1860", "Deutscher Philosoph", "Der große Pessimist: Hinter allem steckt für ihn ein blinder, nie zufriedener Wille, der Leid erzeugt. Trost bieten Kunst, Mitleid und Askese. Er lebte zurückgezogen in Frankfurt mit seinen Pudeln und war stark von indischer Philosophie beeinflusst."],
  "Georg Christoph Lichtenberg": ["1742 – 1799", "Physiker und Aphoristiker", "Professor für Physik in Göttingen und einer der witzigsten Köpfe der deutschen Literatur. In seine Notizhefte, die „Sudelbücher“, schrieb er Einfälle, Beobachtungen und Bosheiten."],
  "Søren Kierkegaard": ["1813 – 1855", "Dänischer Philosoph", "Gilt als Vater des Existenzialismus. Er schrieb unter vielen Pseudonymen und stellte den einzelnen Menschen mit seiner Angst, Verzweiflung und Entscheidungsfreiheit ins Zentrum. Er starb mit 42 Jahren in Kopenhagen."],
  "Karl Marx": ["1818 – 1883", "Philosoph und Ökonom", "Geboren in Trier, später im Exil in London. Mit Friedrich Engels schrieb er das „Kommunistische Manifest“, dazu das „Kapital“. Seine Analyse des Kapitalismus hat die Weltgeschichte verändert wie kaum ein anderes Denken."],
  "John Stuart Mill": ["1806 – 1873", "Englischer Philosoph", "Lernte als Kind Griechisch mit drei Jahren und erlitt mit 20 eine schwere Krise. Er verteidigte den Utilitarismus, die individuelle Freiheit und als einer der ersten Männer im Parlament das Frauenwahlrecht."],
  "Friedrich Nietzsche": ["1844 – 1900", "Deutscher Philosoph", "Wurde mit 24 Jahren Professor in Basel. Er kritisierte Moral, Religion und Wahrheit radikal und suchte nach einer Bejahung des Lebens. Anfang 1889 brach er in Turin geistig zusammen und schrieb danach nichts mehr."],
  "Ludwig Wittgenstein": ["1889 – 1951", "Österreichisch-britischer Philosoph", "Stammte aus einer der reichsten Familien Wiens, verschenkte sein Erbe und arbeitete zeitweise als Volksschullehrer und Gärtner. Er dachte darüber nach, was Sprache kann und wo sie an Grenzen stößt, und tat das gleich zweimal sehr verschieden."],
  "Theodor W. Adorno": ["1903 – 1969", "Philosoph und Soziologe", "Kopf der Frankfurter Schule und der Kritischen Theorie, außerdem Musiker und Komponist. Im amerikanischen Exil schrieb er mit Max Horkheimer die „Dialektik der Aufklärung“."],
  "Hannah Arendt": ["1906 – 1975", "Politische Theoretikerin", "Wuchs in Königsberg auf, floh 1933 aus Deutschland und lebte ab 1941 in New York. Sie untersuchte Totalitarismus, Macht und Verantwortung. Für ihren Bericht über den Eichmann-Prozess prägte sie den Begriff der „Banalität des Bösen“."],
  "Albert Camus": ["1913 – 1960", "Französischer Schriftsteller und Philosoph", "Wuchs arm in Algerien auf. Er dachte über das Absurde nach, also den Widerspruch zwischen unserer Sinnsuche und einer schweigenden Welt, und antwortete mit Auflehnung und Lebensfreude. Nobelpreis 1957, drei Jahre später starb er bei einem Autounfall."],
  "Jean-Paul Sartre": ["1905 – 1980", "Französischer Philosoph", "Die Leitfigur des Existenzialismus: Der Mensch ist nichts anderes als das, wozu er sich macht. Er schrieb Philosophie, Romane und Theaterstücke und lehnte 1964 den Literaturnobelpreis ab."],
  "Simone de Beauvoir": ["1908 – 1986", "Französische Philosophin und Schriftstellerin", "Mit „Das andere Geschlecht“ schrieb sie eines der Grundbücher des Feminismus. Mit Sartre verband sie eine lebenslange, offene Beziehung. Sie schrieb außerdem Romane und mehrere Bände Autobiografie."],
  "Simone Weil": ["1909 – 1943", "Französische Philosophin", "Brillante Philosophin, die bewusst in Fabriken arbeitete, um das Leben der Arbeiter zu teilen, und im Spanischen Bürgerkrieg kämpfte. Später wandte sie sich der Mystik zu. Sie starb mit 34 Jahren im englischen Exil."],
  "Viktor Frankl": ["1905 – 1997", "Österreichischer Psychiater", "Überlebte Theresienstadt, Auschwitz und Dachau; seine Frau und seine Eltern wurden ermordet. Er begründete die Logotherapie, deren Kern lautet: Der Mensch braucht vor allem einen Sinn."],
  "Albert Schweitzer": ["1875 – 1965", "Theologe, Arzt und Musiker", "Studierte mit 30 Jahren noch Medizin und gründete ein Krankenhaus in Lambaréné im heutigen Gabun. Seine Ethik der „Ehrfurcht vor dem Leben“ brachte ihm den Friedensnobelpreis ein."],
  "Karl Popper": ["1902 – 1994", "Österreichisch-britischer Philosoph", "Erkannte, dass Theorien nie endgültig bewiesen, nur widerlegt werden können. Im Exil in Neuseeland schrieb er „Die offene Gesellschaft und ihre Feinde“, eine Verteidigung der Demokratie."],
  "Rosa Luxemburg": ["1871 – 1919", "Sozialistin und Theoretikerin", "Polnisch-deutsche Ökonomin und eine der wichtigsten Stimmen der Arbeiterbewegung. Sie war gegen den Ersten Weltkrieg und saß dafür lange in Haft. Im Januar 1919 wurde sie in Berlin von Freikorps-Soldaten ermordet."],
  "Bertrand Russell": ["1872 – 1970", "Britischer Philosoph und Logiker", "Mitbegründer der modernen Logik und analytischen Philosophie, außerdem streitbarer Pazifist, der dafür im Gefängnis saß. Er erhielt 1950 den Literaturnobelpreis und wurde 97 Jahre alt."],
  "William James": ["1842 – 1910", "Amerikanischer Psychologe und Philosoph", "Gründete die akademische Psychologie in den USA und den Pragmatismus mit. Eine Idee ist für ihn wahr, wenn sie sich im Leben bewährt. Sein Bruder war der Schriftsteller Henry James."],
  "Iris Murdoch": ["1919 – 1999", "Irisch-britische Philosophin und Schriftstellerin", "Lehrte Philosophie in Oxford und schrieb 26 Romane. Für sie beginnt Moral mit Aufmerksamkeit: die Welt und andere Menschen wirklich zu sehen, statt nur sich selbst."],
  "Alan Watts": ["1915 – 1973", "Britischer Philosoph", "Machte Zen-Buddhismus und Daoismus im Westen bekannt, vor allem durch Bücher und Radiovorträge in Kalifornien. Er erklärte östliches Denken mit viel Humor und Leichtigkeit."],
  "Johann Wolfgang von Goethe": ["1749 – 1832", "Dichter und Naturforscher", "Wurde mit dem „Werther“ über Nacht berühmt und arbeitete rund 60 Jahre am „Faust“. In Weimar war er auch Minister und forschte über Farben, Pflanzen und Knochen. Er ist der bekannteste Dichter deutscher Sprache."],
  "Friedrich Schiller": ["1759 – 1805", "Dichter und Philosoph", "Floh als junger Militärarzt nach der Uraufführung seiner „Räuber“ aus Württemberg. Später schrieb er Dramen wie „Wilhelm Tell“ und dachte über Freiheit und Schönheit nach. Mit Goethe verband ihn eine berühmte Freundschaft."],
  "Friedrich Hölderlin": ["1770 – 1843", "Dichter", "Studierte in Tübingen zusammen mit Hegel und Schelling. Seine Gedichte verbinden griechische Götterwelt und Sehnsucht. Die zweite Hälfte seines Lebens verbrachte er psychisch krank in einem Turm am Neckar."],
  "Novalis": ["1772 – 1801", "Dichter der Frühromantik", "Eigentlich Friedrich von Hardenberg, im Beruf Salinenassessor. Nach dem Tod seiner jungen Verlobten schrieb er die „Hymnen an die Nacht“. Die „blaue Blume“ aus seinem Roman wurde zum Symbol der Romantik. Er starb mit 28 Jahren."],
  "Rainer Maria Rilke": ["1875 – 1926", "Dichter", "Geboren in Prag, lebte er rastlos in ganz Europa, unter anderem als Sekretär des Bildhauers Rodin. Die „Duineser Elegien“ und „Sonette an Orpheus“ gehören zu den bedeutendsten Gedichten des 20. Jahrhunderts."],
  "Hermann Hesse": ["1877 – 1962", "Schriftsteller", "Seine Romane „Siddhartha“, „Steppenwolf“ und „Das Glasperlenspiel“ handeln von der Suche nach dem eigenen Weg. Er lebte ab 1919 im Tessin und erhielt 1946 den Literaturnobelpreis. In den 1960ern wurde er zum Kultautor der Hippies."],
  "Franz Kafka": ["1883 – 1924", "Schriftsteller", "Arbeitete tagsüber in einer Prager Versicherung und schrieb nachts. Er wollte, dass sein Freund Max Brod seine Manuskripte verbrennt; Brod veröffentlichte sie trotzdem. So kennen wir „Der Process“ und „Das Schloss“."],
  "Marie von Ebner-Eschenbach": ["1830 – 1916", "Österreichische Schriftstellerin", "Adelige aus Mähren, die sich gegen viele Widerstände als Schriftstellerin durchsetzte. Bekannt sind ihre Erzählungen wie „Krambambuli“ und ihre treffsicheren Aphorismen."],
  "Erich Kästner": ["1899 – 1974", "Schriftsteller", "Schrieb „Emil und die Detektive“ und „Das doppelte Lottchen“, aber auch scharfe Gedichte für Erwachsene. 1933 sah er in Berlin zu, wie seine eigenen Bücher verbrannt wurden."],
  "Wilhelm von Humboldt": ["1767 – 1835", "Gelehrter und Bildungsreformer", "Gründete 1810 die Berliner Universität, die heute seinen Namen trägt, und prägte das Ideal der umfassenden Bildung. Er war Diplomat und Sprachforscher. Sein Bruder war der Naturforscher Alexander von Humboldt."],
  "Dietrich Bonhoeffer": ["1906 – 1945", "Theologe und Widerstandskämpfer", "Evangelischer Pfarrer, der früh gegen das NS-Regime auftrat und Kontakt zum Widerstand hatte. Er wurde 1943 verhaftet und im April 1945, wenige Wochen vor Kriegsende, im KZ Flossenbürg hingerichtet."],
  "Fjodor Dostojewski": ["1821 – 1881", "Russischer Schriftsteller", "Wurde 1849 zum Tod verurteilt, erst auf dem Richtplatz begnadigt und dann nach Sibirien verbannt. Seine Romane wie „Schuld und Sühne“ und „Die Brüder Karamasow“ erkunden Schuld, Glauben und Freiheit."],
  "Marie Curie": ["1867 – 1934", "Physikerin und Chemikerin", "In Warschau geboren, forschte sie in Paris zur Radioaktivität und entdeckte Polonium und Radium. Sie war die erste Frau mit Nobelpreis und bis heute der einzige Mensch mit Nobelpreisen in zwei Naturwissenschaften."],
  "Albert Einstein": ["1879 – 1955", "Physiker", "Veröffentlichte 1905 als Angestellter im Berner Patentamt gleich mehrere bahnbrechende Arbeiten, darunter die spezielle Relativitätstheorie. Nobelpreis 1921. 1933 emigrierte er in die USA, wo er auch für Frieden und Bürgerrechte eintrat."],
  "William Shakespeare": ["1564 – 1616", "Englischer Dramatiker und Dichter", "Aus Stratford-upon-Avon, Schauspieler und Teilhaber am Londoner Globe Theatre. Er schrieb rund 38 Stücke und 154 Sonette und gilt als größter Dramatiker der Weltliteratur."],
  "John Donne": ["1572 – 1631", "Englischer Dichter und Prediger", "Schrieb in jungen Jahren kühne Liebesgedichte, später wurde er Dekan der St Paul’s Cathedral in London. Er ist der bekannteste der „metaphysischen Dichter“."],
  "William Blake": ["1757 – 1827", "Dichter, Maler und Kupferstecher", "Ein Visionär, der von Kindheit an von Engeln erzählte. Er gestaltete seine Gedichtbände selbst als handkolorierte Druckwerke. Zu Lebzeiten kaum beachtet, gilt er heute als großer Romantiker."],
  "John Keats": ["1795 – 1821", "Englischer Dichter der Romantik", "Brach eine Ausbildung zum Chirurgen ab, um Dichter zu werden. Fast alle seine großen Gedichte entstanden in nur wenigen Jahren. Er starb mit 25 Jahren in Rom an Tuberkulose."],
  "Ralph Waldo Emerson": ["1803 – 1882", "Amerikanischer Essayist", "Gab sein Amt als Pfarrer auf und wurde Kopf des Transzendentalismus. Er lehrte Selbstvertrauen, Naturverbundenheit und eigenes Denken. Er war Mentor und Freund von Henry David Thoreau."],
  "Henry David Thoreau": ["1817 – 1862", "Amerikanischer Schriftsteller", "Lebte zwei Jahre allein in einer selbst gebauten Hütte am Walden-See. Weil er keine Steuern für Sklaverei und Krieg zahlen wollte, kam er ins Gefängnis. Sein Essay über zivilen Ungehorsam inspirierte später Gandhi und Martin Luther King."],
  "Walt Whitman": ["1819 – 1892", "Amerikanischer Dichter", "Arbeitete als Drucker, Lehrer und im Bürgerkrieg als Krankenpfleger. Sein Lebenswerk „Leaves of Grass“ erweiterte er immer wieder. Mit seinem freien Vers wurde er zum Vater der modernen amerikanischen Lyrik."],
  "Emily Dickinson": ["1830 – 1886", "Amerikanische Dichterin", "Lebte zurückgezogen in Amherst, Massachusetts, und verließ das Haus später kaum. Nach ihrem Tod fand ihre Schwester fast 1800 Gedichte; zu Lebzeiten waren nur rund zehn erschienen."],
  "Oscar Wilde": ["1854 – 1900", "Irischer Schriftsteller", "Der glänzendste Spötter des viktorianischen London, Autor von „Das Bildnis des Dorian Gray“ und vieler Komödien. 1895 wurde er wegen seiner Homosexualität zu zwei Jahren Zuchthaus verurteilt. Er starb verarmt in Paris."],
  "Virginia Woolf": ["1882 – 1941", "Englische Schriftstellerin", "Zentrale Figur der Bloomsbury Group und der literarischen Moderne. In Romanen wie „Mrs Dalloway“ und „Zum Leuchtturm“ folgt sie dem Strom der Gedanken. Sie gründete mit ihrem Mann einen eigenen Verlag."],
  "George Orwell": ["1903 – 1950", "Englischer Schriftsteller", "Eigentlich Eric Blair. Er war Polizist in Burma, lebte unter Obdachlosen und kämpfte im Spanischen Bürgerkrieg. Mit „1984“ und „Farm der Tiere“ schrieb er die bekanntesten Warnungen vor Totalitarismus."],
  "J. R. R. Tolkien": ["1892 – 1973", "Englischer Philologe und Schriftsteller", "Professor für Altenglisch in Oxford, der eigene Sprachen erfand und dafür eine ganze Welt erschuf: Mittelerde. „Der Hobbit“ und „Der Herr der Ringe“ begründeten die moderne Fantasy."],
  "Samuel Beckett": ["1906 – 1989", "Irischer Dramatiker und Schriftsteller", "Lebte in Paris und schrieb auf Englisch und Französisch. Mit „Warten auf Godot“ veränderte er das Theater. Seine Texte werden immer karger, ernster und zugleich komischer. Nobelpreis 1969."],
  "James Baldwin": ["1924 – 1987", "Amerikanischer Schriftsteller", "Wuchs in Harlem auf und ging mit 24 Jahren nach Paris, um dem Rassismus zu entkommen. Seine Essays wie „The Fire Next Time“ wurden zu wichtigen Stimmen der Bürgerrechtsbewegung."],
  "Martin Luther King Jr.": ["1929 – 1968", "Bürgerrechtler und Pastor", "Führte die amerikanische Bürgerrechtsbewegung mit gewaltlosem Widerstand an. Seine Rede „I Have a Dream“ von 1963 ist weltberühmt. Friedensnobelpreis 1964, 1968 wurde er in Memphis ermordet."],
  "Maya Angelou": ["1928 – 2014", "Amerikanische Dichterin und Autorin", "War Tänzerin, Sängerin, Journalistin und Bürgerrechtlerin, bevor sie mit ihrer Autobiografie „Ich weiß, warum der gefangene Vogel singt“ berühmt wurde. 1993 las sie ein Gedicht bei der Amtseinführung von Präsident Clinton."],
  "Mary Oliver": ["1935 – 2019", "Amerikanische Dichterin", "Schrieb fast ausschließlich über Spaziergänge, Tiere und Pflanzen, und darüber, wie man aufmerksam lebt. Sie gewann 1984 den Pulitzer-Preis und war eine der meistgelesenen Dichterinnen Amerikas."],
  "Annie Dillard": ["geboren 1945", "Amerikanische Schriftstellerin", "Wurde mit „Pilger am Tinker Creek“ bekannt, genauen Beobachtungen der Natur an einem Bach in Virginia, für die sie 1975 den Pulitzer-Preis erhielt. Sie schreibt über Natur, Glauben und das Schreiben selbst."],
  "Ursula K. Le Guin": ["1929 – 2018", "Amerikanische Schriftstellerin", "Tochter eines Anthropologen und eine der großen Autorinnen von Science-Fiction und Fantasy, etwa mit dem „Erdsee“-Zyklus. Ihre Welten fragen nach Geschlecht, Macht und Freiheit. Sie übersetzte auch das Daodejing."],
  "Toni Morrison": ["1931 – 2019", "Amerikanische Schriftstellerin", "Arbeitete als Lektorin und schrieb nebenbei ihre Romane, darunter „Menschenkind“. Sie erzählte afroamerikanische Geschichte mit großer poetischer Kraft und erhielt 1993 als erste Schwarze Frau den Literaturnobelpreis."],
  "Audre Lorde": ["1934 – 1992", "Amerikanische Dichterin und Aktivistin", "Beschrieb sich selbst als „schwarz, lesbisch, Mutter, Kriegerin, Dichterin“. Sie schrieb über Rassismus, Feminismus und ihre Krebserkrankung und prägte das Denken über Mehrfachdiskriminierung."],
  "bell hooks": ["1952 – 2021", "Amerikanische Theoretikerin", "Eigentlich Gloria Jean Watkins; sie schrieb ihren Namen klein, damit ihre Ideen wichtiger sind als ihre Person. Sie schrieb über Feminismus, Rassismus, Bildung und darüber, wie Liebe die Gesellschaft verändern kann."],
  "Carl Sagan": ["1934 – 1996", "Amerikanischer Astronom", "Erforschte Planeten und half bei NASA-Missionen. Mit seiner Fernsehserie „Unser Kosmos“ brachte er Millionen Menschen die Wissenschaft nahe. Auf seine Idee hin fotografierte Voyager 1 die Erde als „blassblauen Punkt“."],
  "Richard Feynman": ["1918 – 1988", "Amerikanischer Physiker", "Nobelpreis 1965 für Quantenelektrodynamik, berühmt als neugieriger, verspielter Lehrer. Er spielte Bongo, knackte Safes und zeigte bei der Untersuchung des Challenger-Unglücks mit einem Glas Eiswasser, woran es lag."]
};

// Werke: [Jahr, Art, Beschreibung]; Schlüssel = Quelle bis zum ersten Komma (oder die ganze Quelle)
const S = {
  "Handbüchlein der Moral": ["um 125 n. Chr.", "Lehrbuch", "Epiktets Schüler Arrian fasste die Lehre seines Meisters in 53 kurzen Abschnitten zusammen. Es beginnt mit der Unterscheidung zwischen dem, was in unserer Macht steht, und dem, was nicht. Jahrhundertelang war es eine Art Taschenbuch für die Lebensführung."],
  "Briefe an Lucilius": ["um 62 – 65 n. Chr.", "Briefsammlung", "124 Briefe an Senecas jüngeren Freund Lucilius, geschrieben in seinen letzten Lebensjahren. Sie handeln von Zeit, Tod, Freundschaft, Angst und Reichtum, praktisch und persönlich. Bis heute einer der schönsten Einstiege in die Stoa."],
  "Von der Kürze des Lebens": ["um 49 n. Chr.", "Philosophischer Essay", "Seneca widerspricht der Klage, das Leben sei zu kurz: Es ist lang genug, wir verschwenden es nur. Wer seine Zeit mit Geschäften, Ehrgeiz und Ablenkung füllt, hat am Ende kaum gelebt."],
  "Selbstbetrachtungen": ["um 170 – 180 n. Chr.", "Persönliche Notizen", "Auf Griechisch geschriebene Notizen, eigentlich mit „An sich selbst“ überschrieben. Marc Aurel ermahnt sich darin, gelassen, gerecht und freundlich zu bleiben. Das Buch war nie zur Veröffentlichung gedacht, gerade deshalb wirkt es so ehrlich."],
  "nach Platon": ["um 399 – 380 v. Chr.", "Dialoge Platons", "Sokrates schrieb selbst nichts. In der „Apologie“ gibt Platon Sokrates’ Verteidigungsrede vor dem Gericht wieder, das ihn zum Tod verurteilte. Im „Gorgias“ streitet Sokrates darüber, ob Macht oder Gerechtigkeit glücklich macht."],
  "Fragment B 91": ["um 500 v. Chr.", "Fragment", "Heraklits Buch ist verloren; erhalten sind nur Sätze, die spätere Autoren zitierten. Die Nummer folgt der Standardausgabe von Diels und Kranz. Das Bild vom Fluss steht für seine Lehre, dass alles fließt und sich wandelt."],
  "Fragment B 119": ["um 500 v. Chr.", "Fragment", "Heraklits Buch ist verloren; erhalten sind nur Sätze, die spätere Autoren zitierten. Die Nummer folgt der Standardausgabe von Diels und Kranz. Im Griechischen steht für „Schicksal“ das Wort „Daimon“: Unser Charakter ist unser Schutzgeist."],
  "Nikomachische Ethik": ["um 330 v. Chr.", "Philosophisches Lehrwerk", "Benannt nach Aristoteles’ Sohn Nikomachos. Es fragt, was ein gelungenes Leben ist, und antwortet: tugendhaft handeln, über ein ganzes Leben hinweg. Tugend ist dabei die richtige Mitte zwischen zwei Extremen, etwa Mut zwischen Feigheit und Tollkühnheit."],
  "Politik": ["um 330 v. Chr.", "Philosophisches Lehrwerk", "Aristoteles vergleicht Verfassungen griechischer Stadtstaaten und fragt, welche Staatsform die beste ist. Grundlage ist der Gedanke, dass der Mensch nur in Gemeinschaft wirklich Mensch sein kann."],
  "zu Alexander dem Großen": ["Anekdote, überliefert im 3. Jh. n. Chr.", "Überlieferte Anekdote", "Diogenes Laertios erzählt in seinen Lebensbeschreibungen der Philosophen: Alexander der Große trat zu Diogenes, der sich sonnte, und bot ihm an, sich etwas zu wünschen. Diogenes bat nur, er möge ihm aus der Sonne gehen."],
  "Brief an Menoikeus": ["um 300 v. Chr.", "Lehrbrief", "Ein kurzer Brief, in dem Epikur seine ganze Ethik zusammenfasst: keine Angst vor den Göttern, keine Angst vor dem Tod, maßvolle Freude als Ziel. Er ist nur erhalten, weil Diogenes Laertios ihn vollständig abschrieb."],
  "Briefe an Freunde": ["62 – 43 v. Chr.", "Briefsammlung", "Über 400 Briefe Ciceros an Freunde, Verwandte und Politiker, die nach seinem Tod in 16 Büchern herausgegeben wurden. Der Satz über Garten und Bibliothek steht in einem Brief an den Gelehrten Varro."],
  "Oden": ["23 v. Chr.", "Gedichtsammlung", "Horaz’ Gedichte in griechischen Versmaßen über Liebe, Freundschaft, Wein und Vergänglichkeit. In Ode I 11 rät er Leukonoe, nicht in den Sternen nach der Zukunft zu forschen, sondern den Tag zu pflücken: „carpe diem“."],
  "Bekenntnisse": ["um 397 – 401", "Autobiografie", "Augustinus erzählt Gott sein Leben, von den Jugendsünden bis zur Bekehrung. Die späteren Bücher werden philosophisch; Buch XI enthält eine der berühmtesten Untersuchungen über die Natur der Zeit."],
  "Daodejing": ["etwa 4. Jh. v. Chr.", "Grundtext des Daoismus", "81 kurze, rätselhafte Kapitel mit nur rund 5000 Schriftzeichen. Es geht um das Dao, den Weg allen Seins, und um das Handeln durch Nicht-Eingreifen. Es ist eines der meistübersetzten Bücher der Welt."],
  "Gespräche": ["5. – 3. Jh. v. Chr.", "Spruchsammlung", "Die „Lunyu“ oder „Analekten“: kurze Aussprüche und Gespräche des Konfuzius, nach seinem Tod von Schülern gesammelt. In 20 Büchern geht es um Bildung, Menschlichkeit, Familie und gutes Regieren."],
  "Zhuangzi": ["4. – 3. Jh. v. Chr.", "Philosophische Prosa", "Das nach Zhuangzi benannte Buch voller Fabeln, Dialoge und Paradoxien. Riesige Vögel, weise Köche und nutzlose Bäume zeigen, wie relativ unsere Maßstäbe sind. Nur die ersten sieben Kapitel gelten als von ihm selbst."],
  "Peace Is Every Step": ["1991", "Achtsamkeitsbuch", "Auf Deutsch „Ich pflanze ein Lächeln“. Kurze Texte darüber, wie man im Alltag achtsam wird: beim Atmen, beim Abwaschen, beim Gehen, sogar beim Warten an der roten Ampel."],
  "Abhandlung über die Methode": ["1637", "Philosophische Abhandlung", "Descartes schrieb sie auf Französisch statt Latein, damit jeder sie lesen kann. Er beschreibt, wie er alles bezweifelt, bis nur „Ich denke, also bin ich“ übrig bleibt. Ursprünglich war sie die Einleitung zu drei naturwissenschaftlichen Schriften."],
  "Gedanken": ["1670 (posthum)", "Fragmentsammlung", "Die „Pensées“ sind Notizen für ein geplantes Buch zur Verteidigung des Christentums, das Pascal nie vollendete. Darin stehen seine berühmte Wette auf Gott und Gedanken über das Elend und die Größe des Menschen."],
  "Ethik": ["1677 (posthum)", "Philosophisches Hauptwerk", "Spinoza schrieb sie „nach geometrischer Methode“: mit Definitionen, Axiomen und Beweisen wie ein Mathematikbuch. Es geht um Gott als Natur, um Gefühle und darum, wie wir durch Erkenntnis frei werden."],
  "Essais": ["1580 – 1588", "Essaysammlung", "Montaigne nannte seine Texte „Versuche“ und erfand damit eine neue Gattung. Er schreibt über Freundschaft, Kannibalen, Daumen, Tod und vor allem über sich selbst. Kapitel I 39 handelt von der Einsamkeit."],
  "Candide": ["1759", "Satirischer Roman", "Der naive Candide glaubt, er lebe in der „besten aller möglichen Welten“, und erlebt dann Krieg, Erdbeben und Inquisition. Voltaire verspottet damit den Optimismus des Philosophen Leibniz. Am Ende steht der Rat, seinen Garten zu bestellen."],
  "Vom Gesellschaftsvertrag": ["1762", "Politische Schrift", "Rousseau fragt, wie Menschen in einem Staat leben und trotzdem frei bleiben können. Seine Antwort ist die Herrschaft des Gemeinwillens des Volkes. Das Buch wurde zu einer Bibel der Französischen Revolution."],
  "Meditationes sacrae": ["1597", "Religiöse Betrachtungen", "Eine kleine lateinische Sammlung religiöser Meditationen. Darin steht der Satz „ipsa scientia potestas est“, „Wissen selbst ist Macht“, der zum Motto der modernen Wissenschaft wurde."],
  "A Treatise of Human Nature": ["1739 – 1740", "Philosophisches Hauptwerk", "Hume schrieb diesen „Traktat über die menschliche Natur“ mit Mitte zwanzig. Er erklärt das Denken aus Erfahrung und Gewohnheit und die Moral aus Gefühlen. Er klagte, es sei „totgeboren aus der Presse gefallen“; heute ist es ein Klassiker."],
  "Beantwortung der Frage: Was ist Aufklärung?": ["1784", "Zeitschriftenaufsatz", "Erschien in der „Berlinischen Monatsschrift“. Kant definiert Aufklärung als „Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit“. Der Wahlspruch „Sapere aude!“, also „Habe Mut, dich deines eigenen Verstandes zu bedienen“, wurde zum Leitsatz einer ganzen Epoche."],
  "Kritik der praktischen Vernunft": ["1788", "Philosophisches Hauptwerk", "Die zweite von Kants drei Kritiken, über Moral und Freiheit. Der Satz vom bestirnten Himmel und dem moralischen Gesetz steht im Schlusskapitel und ist auf einer Gedenktafel für Kant in Königsberg eingraviert."],
  "Grundlegung zur Metaphysik der Sitten": ["1785", "Philosophische Schrift", "Kants kürzeste Ethik und Einstieg in seine Moralphilosophie. Hier formuliert er den kategorischen Imperativ: ein Prüfstein dafür, ob eine Handlung moralisch ist."],
  "Vorlesungen über die Philosophie der Geschichte": ["1837 (posthum)", "Vorlesungen", "Aus Mitschriften von Hegels Berliner Vorlesungen zusammengestellt. Weltgeschichte erscheint als Fortschritt im Bewusstsein der Freiheit, vom alten China bis zum modernen Europa."],
  "Grundlinien der Philosophie des Rechts": ["1820", "Philosophisches Hauptwerk", "Hegels Theorie von Recht, Moral, Familie, Gesellschaft und Staat. Das Bild der Eule der Minerva steht in der Vorrede: Philosophie begreift eine Zeit erst, wenn sie zu Ende geht."],
  "Preisschrift über die Freiheit des Willens": ["1839", "Preisschrift", "Schopenhauer reichte sie bei einem Wettbewerb der Norwegischen Königlichen Akademie der Wissenschaften ein und gewann. Er argumentiert, dass wir zwar tun können, was wir wollen, unser Wollen aber durch unseren Charakter festgelegt ist."],
  "Die Welt als Wille und Vorstellung": ["1819, erweitert 1844", "Philosophisches Hauptwerk", "Die Welt ist einerseits unsere Vorstellung, andererseits Ausdruck eines blinden Willens, der nie zur Ruhe kommt. Zunächst kaum beachtet, wurde das Buch später enorm einflussreich, etwa für Wagner, Nietzsche und Freud."],
  "Sudelbücher": ["1764 – 1799", "Notizhefte", "Lichtenberg nannte seine Notizbücher nach dem kaufmännischen „Sudelbuch“, in das man alles erst einmal hineinschreibt. Sie enthalten Einfälle, Beobachtungen, Witze und Aphorismen und wurden erst nach seinem Tod veröffentlicht."],
  "Tagebücher": ["1834 – 1855", "Tagebücher", "Kierkegaard führte über zwanzig Jahre Tagebücher und Journale mit tausenden Seiten. Sie zeigen den Denker hinter seinen vielen Pseudonymen: zweifelnd, verliebt, verzweifelt, gläubig."],
  "Der Begriff Angst": ["1844", "Philosophische Schrift", "Unter dem Pseudonym Vigilius Haufniensis veröffentlicht. Angst ist für Kierkegaard keine Furcht vor etwas Bestimmtem, sondern das Gefühl angesichts der eigenen Freiheit, der Möglichkeit, sich zu entscheiden."],
  "Thesen über Feuerbach": ["1845, veröffentlicht 1888", "Notizen", "Elf kurze Thesen, die Marx in ein Notizbuch schrieb und die Engels erst nach Marx’ Tod veröffentlichte. Die elfte These steht auf Marx’ Grab in London und im Foyer der Humboldt-Universität."],
  "Utilitarianism": ["1861", "Philosophische Schrift", "Mill verteidigt das Prinzip, dass richtig ist, was das größte Glück für die meisten bringt. Anders als sein Vorgänger Bentham unterscheidet er dabei höhere und niedere Freuden."],
  "Götzen-Dämmerung": ["1889", "Philosophische Streitschrift", "Untertitel: „Wie man mit dem Hammer philosophiert“. Nietzsche klopft darin die „Götzen“ seiner Zeit ab, also Moral, Vernunft und Idealismus, um zu hören, ob sie hohl sind. Das erste Kapitel besteht aus kurzen „Sprüchen und Pfeilen“."],
  "Also sprach Zarathustra": ["1883 – 1885", "Philosophische Dichtung", "„Ein Buch für Alle und Keinen“: Der Prophet Zarathustra steigt von seinem Berg und verkündet den Übermenschen und die ewige Wiederkunft. Nietzsche hielt es für sein wichtigstes Werk."],
  "nach Pindar": ["um 470 v. Chr. / 1882", "Ode / Aphorismen", "Der griechische Dichter Pindar schrieb: „Werde, der du bist, nachdem du es erfahren hast.“ Nietzsche griff den Satz in „Die fröhliche Wissenschaft“ auf und machte ihn zu einem Leitmotiv, später auch im Untertitel von „Ecce homo“: „Wie man wird, was man ist“."],
  "Tractatus logico-philosophicus": ["1921", "Philosophische Abhandlung", "Das einzige philosophische Buch, das Wittgenstein zu Lebzeiten veröffentlichte, in nummerierten Sätzen. Er entwarf es als Soldat im Ersten Weltkrieg und glaubte, damit alle Probleme der Philosophie gelöst zu haben."],
  "Philosophische Untersuchungen": ["1953 (posthum)", "Philosophisches Hauptwerk", "Der späte Wittgenstein widerspricht seinem früheren Ich: Die Bedeutung eines Wortes ist sein Gebrauch in der Sprache. Er spricht von „Sprachspielen“ und will die Fliege aus dem Fliegenglas befreien."],
  "Minima Moralia": ["1951", "Aphorismen", "Untertitel: „Reflexionen aus dem beschädigten Leben“. Adorno schrieb die Texte im amerikanischen Exil während und nach dem Zweiten Weltkrieg. Kleine Beobachtungen aus dem Alltag werden zu Kritik an der ganzen Gesellschaft."],
  "Gespräch mit Joachim Fest": ["1964", "Rundfunkgespräch", "Ein Radiogespräch mit dem Journalisten Joachim Fest über Arendts Buch „Eichmann in Jerusalem“. Sie betont darin, dass Gehorsam keine Entschuldigung ist: Wer mitmacht, unterstützt."],
  "Der Mythos des Sisyphos": ["1942", "Philosophischer Essay", "Camus fragt, ob das Leben angesichts seiner Sinnlosigkeit lebenswert ist. Seine Antwort ist Sisyphos, der ewig seinen Stein bergauf rollt und darin trotzdem sein Glück findet."],
  "Heimkehr nach Tipasa": ["1952", "Essay", "Camus kehrt zu den römischen Ruinen von Tipasa an der algerischen Küste zurück, die er aus seiner Jugend kennt. Inmitten von Kälte und Krieg findet er dort sein Licht wieder. Erschienen im Band „Heimkehr nach Tipasa“ (L’Été)."],
  "Der Existentialismus ist ein Humanismus": ["1946", "Vortrag", "Ein Vortrag von 1945 in Paris, so überfüllt, dass Menschen in Ohnmacht fielen. Sartre erklärt allgemeinverständlich: Die Existenz geht der Essenz voraus. Erst durch unser Handeln werden wir, was wir sind."],
  "Das andere Geschlecht": ["1949", "Philosophisches Hauptwerk", "Ein fast tausendseitiges Werk darüber, wie Frauen in Geschichte, Mythos und Alltag zum „Anderen“ des Mannes gemacht wurden. Es wurde zum Grundbuch der zweiten Welle des Feminismus."],
  "Brief an Joë Bousquet": ["1942", "Brief", "Simone Weil schrieb dem französischen Dichter Joë Bousquet, der seit einer Kriegsverletzung gelähmt war. In ihrem Briefwechsel geht es um Leid, Liebe und Aufmerksamkeit für andere."],
  "… trotzdem Ja zum Leben sagen": ["1946", "Erfahrungsbericht", "Frankl beschreibt seine Erfahrungen in den Konzentrationslagern und was Menschen dort Halt gab. Daraus entwickelt er seine Lehre vom Sinn. Auf Englisch heißt es „Man’s Search for Meaning“ und hat sich millionenfach verkauft."],
  "Kultur und Ethik": ["1923", "Kulturphilosophie", "Schweitzer entwickelt hier seine Ethik der „Ehrfurcht vor dem Leben“, die ihm 1915 auf einer Flussfahrt in Afrika eingefallen war. Jedes Leben, auch das von Tieren und Pflanzen, verdient Achtung."],
  "Alles Leben ist Problemlösen": ["1994", "Aufsatzsammlung", "Poppers letztes Buch versammelt Aufsätze über Erkenntnis, Geschichte und Politik. Optimismus sieht er darin als moralische Pflicht: Die Zukunft ist offen, und wir alle tragen zu ihr bei."],
  "Zur russischen Revolution": ["1918, veröffentlicht 1922", "Politische Schrift", "Im Gefängnis geschrieben. Luxemburg begrüßt die Revolution in Russland, kritisiert aber scharf, dass Lenin Demokratie und Pressefreiheit abschafft. Der berühmte Satz steht als Randnotiz im Manuskript."],
  "What I Believe": ["1925", "Essay", "Ein kurzes Buch, in dem Russell sein Weltbild darlegt: über Natur, den Menschen, das gute Leben und Moral. Ohne Gott, aber mit Liebe und Wissen als Kompass."],
  "The Conquest of Happiness": ["1930", "Ratgeber", "Auf Deutsch „Eroberung des Glücks“. Russell erklärt praktisch, was Menschen unglücklich macht, zum Beispiel Neid, Langeweile oder Sorge, und wie man glücklicher wird: durch Interessen, Zuneigung und Arbeit."],
  "Tagebuch": ["1870", "Tagebucheintrag", "Ein Eintrag vom 30. April 1870, mitten in einer schweren depressiven Krise. Nach der Lektüre des Philosophen Renouvier beschließt James, an den freien Willen zu glauben, und findet dadurch wieder ins Leben."],
  "The Sublime and the Good": ["1959", "Philosophischer Aufsatz", "Murdoch verbindet Kunst und Moral: Beide verlangen, von sich selbst abzusehen und etwas anderes wirklich wahrzunehmen. Liebe ist für sie genau diese Art der Wahrnehmung."],
  "The Essence of Alan Watts": ["1970er-Jahre", "Textsammlung", "Eine Sammlung kurzer Texte, die auf Watts’ Vorträgen beruhen. Es geht um Zen, Zeit, Tod und darum, im gegenwärtigen Moment zu leben."],
  "Faust I": ["1808", "Tragödie", "Der Gelehrte Faust schließt einen Pakt mit dem Teufel Mephisto, um zu erfahren, „was die Welt im Innersten zusammenhält“. Der Satz über das Irren spricht Gott selbst im „Prolog im Himmel“."],
  "Wilhelm Meisters Wanderjahre": ["1821, erweitert 1829", "Roman", "Fortsetzung von „Wilhelm Meisters Lehrjahre“. Ein offener Roman aus Erzählungen, Briefen und Sprüchen über Arbeit, Bildung und Gemeinschaft. Die Spruchsammlungen sind eine Fundgrube für Lebensweisheiten."],
  "Das Göttliche": ["1783", "Gedicht", "Eine Hymne aus Goethes Weimarer Zeit. Die Natur ist gleichgültig; nur der Mensch kann unterscheiden, wählen und richten. Darum soll er edel, hilfreich und gut sein."],
  "Über die ästhetische Erziehung des Menschen": ["1795", "Philosophische Briefe", "27 Briefe an den Prinzen von Augustenburg, der Schiller finanziell unterstützte. Schiller sieht im Spiel und in der Schönheit den Weg zur Freiheit. Der Satz über das Spielen steht im 15. Brief."],
  "Patmos": ["1803", "Hymne", "Eine von Hölderlins späten großen Hymnen, dem Landgrafen von Homburg gewidmet, benannt nach der griechischen Insel. Sie beginnt mit den Versen „Nah ist / Und schwer zu fassen der Gott. / Wo aber Gefahr ist, wächst / Das Rettende auch.“"],
  "Heinrich von Ofterdingen": ["1802 (posthum)", "Roman", "Novalis’ unvollendeter Roman über einen jungen Dichter, der von einer blauen Blume träumt und sich auf die Suche macht. Die blaue Blume wurde zum Symbol der Romantik für Sehnsucht."],
  "Briefe an einen jungen Dichter": ["1929 (posthum)", "Briefe", "Zehn Briefe, die Rilke zwischen 1903 und 1908 dem jungen Offiziersschüler Franz Xaver Kappus schrieb, der ihm seine Gedichte geschickt hatte. Sie handeln von Einsamkeit, Liebe, Geduld und davon, nach innen zu gehen."],
  "Stufen": ["1941", "Gedicht", "Hesse schrieb es nach einer langen Krankheit; später nahm er es in „Das Glasperlenspiel“ auf. Das Leben wird als Folge von Stufen beschrieben, von denen man immer wieder Abschied nehmen muss."],
  "Brief an Oskar Pollak": ["1904", "Brief", "Der 20-jährige Kafka schrieb seinem Schulfreund Oskar Pollak, man solle nur Bücher lesen, die einen beißen und stechen. Ein Buch müsse die Axt sein für das gefrorene Meer in uns."],
  "Aphorismen": ["1880", "Aphorismensammlung", "Ebner-Eschenbachs Sammlung kurzer, scharfsinniger Sätze über Menschen, Moral und Gesellschaft. Sie gilt als eine der besten deutschsprachigen Aphoristikerinnen."],
  "Moral": ["1950", "Epigramm", "Ein Zweizeiler aus Kästners Sammlung „Kurz und bündig“. In nur einer Zeile steckt seine ganze Ethik: Gute Absichten zählen nichts, solange man nicht handelt."],
  "Briefe an eine Freundin": ["1847 (posthum)", "Briefsammlung", "Humboldt schrieb über zwanzig Jahre lang Briefe an Charlotte Diede, eine Frau, die er in seiner Jugend einmal kurz getroffen hatte. Sie wurden ein beliebtes Buch über Freundschaft, Schicksal und Lebenskunst."],
  "Von guten Mächten": ["Dezember 1944", "Gedicht", "Bonhoeffer schrieb das Gedicht im Gestapo-Gefängnis in Berlin als Weihnachtsgruß an seine Verlobte Maria von Wedemeyer und seine Familie. Wenige Monate später wurde er hingerichtet. Heute wird es oft als Kirchenlied gesungen."],
  "Der Idiot": ["1868 – 1869", "Roman", "Fürst Myschkin, gutmütig und naiv, kehrt nach Russland zurück und gerät in eine Welt aus Gier und Leidenschaft. Dostojewski wollte einen „vollkommen schönen Menschen“ darstellen. Der Satz über die Schönheit wird dem Fürsten von anderen zugeschrieben."],
  "zugeschrieben": ["", "Zugeschriebenes Zitat", "Dieser Satz wird der Person häufig zugeschrieben und passt zu ihren Aussagen, eine eindeutige Erstquelle ist aber nicht belegt."],
  "Interview, 1929": ["1929", "Interview", "Gespräch mit dem Journalisten George Sylvester Viereck, erschienen in der „Saturday Evening Post“ unter dem Titel „What Life Means to Einstein“. Einstein sagte darin, er sei Künstler genug, um frei aus seiner Fantasie zu schöpfen."],
  "LIFE Magazine": ["1955", "Zeitschriftenbeitrag", "Kurz nach Einsteins Tod veröffentlichte das Magazin LIFE Erinnerungen von William Miller an ein Gespräch mit ihm. Darin rät Einstein, nie die heilige Neugier zu verlieren."],
  "Hamlet": ["um 1600", "Tragödie", "Prinz Hamlet soll den Mord an seinem Vater rächen und zögert immer wieder. Den Satz sagt er zu Rosencrantz und Guildenstern, als er Dänemark ein Gefängnis nennt: Es liegt am Denken, nicht an den Dingen."],
  "Devotions upon Emergent Occasions": ["1624", "Meditationen", "Donne schrieb diese Betrachtungen während einer lebensgefährlichen Krankheit. In Meditation XVII stehen auch die Worte „for whom the bell tolls“, die Hemingway später für einen Romantitel nutzte."],
  "Auguries of Innocence": ["um 1803, veröffentlicht 1863", "Gedicht", "Ein Gedicht aus paarweise gereimten Versen über Unschuld und Grausamkeit. Die Anfangszeilen über die Welt im Sandkorn gehören zu den bekanntesten der englischen Lyrik."],
  "Endymion": ["1818", "Versepos", "Ein langes Gedicht über den Hirten Endymion, der die Mondgöttin liebt. Der berühmte erste Vers über die ewige Freude an der Schönheit wurde später viel bekannter als das Gedicht selbst."],
  "Self-Reliance": ["1841", "Essay", "Emersons berühmtester Essay: Vertraue dir selbst, folge deiner Intuition und nicht der Meinung der Masse. Er wurde zu einem Grundtext des amerikanischen Individualismus."],
  "Circles": ["1841", "Essay", "Emerson beschreibt das Leben als immer weitere Kreise: Jede Erkenntnis wird von einer größeren umschlossen. Nichts ist endgültig, alles kann neu gedacht werden."],
  "Experience": ["1844", "Essay", "Geschrieben nach dem Tod von Emersons fünfjährigem Sohn Waldo. Ein nachdenklicher Text darüber, wie schwer es ist, das Leben wirklich zu erfassen, und wie man trotzdem weiterlebt."],
  "Walden": ["1854", "Erfahrungsbericht", "Thoreau beschreibt seine zwei Jahre in einer Hütte am Walden-See: einfach leben, selbst Bohnen anbauen, die Natur beobachten. Ein Klassiker über bewusstes, entschleunigtes Leben."],
  "Song of Myself": ["1855", "Langgedicht", "Das Herzstück von „Leaves of Grass“. Whitman feiert sich selbst und zugleich alle Menschen, Körper und Seele, Stadt und Natur. Ohne Reim und festes Versmaß war es damals revolutionär."],
  "Gedicht 254": ["um 1861", "Gedicht", "Eines von Dickinsons bekanntesten Gedichten; sie gab ihren Gedichten keine Titel, darum trägt es eine Nummer. Die Hoffnung erscheint als kleiner Vogel in der Seele, der singt, ohne je etwas zu verlangen."],
  "Lady Windermere’s Fan": ["1892", "Komödie", "Wildes erste große Gesellschaftskomödie über Moral, Ruf und Doppelmoral in der Londoner Oberschicht. Den Satz über die Sterne sagt Lord Darlington."],
  "A Room of One’s Own": ["1929", "Essay", "Auf Basis von Vorträgen in Cambridge. Woolf argumentiert, eine Frau brauche Geld und ein eigenes Zimmer, um schreiben zu können. Ein Grundtext feministischer Literaturkritik."],
  "In Front of Your Nose": ["1946", "Essay", "Ein Zeitungsessay in der „Tribune“. Orwell zeigt, wie Menschen Offensichtliches übersehen, wenn es nicht zu ihren Überzeugungen passt."],
  "The Fellowship of the Ring": ["1954", "Fantasy-Roman", "Der erste Band von „Der Herr der Ringe“, auf Deutsch „Die Gefährten“. Den Satz sagt Gandalf zu Frodo in den Minen von Moria, als Frodo wünscht, all das wäre nicht zu seiner Zeit geschehen."],
  "Worstward Ho": ["1983", "Prosatext", "Einer von Becketts letzten Texten, sehr karg und rhythmisch. Die Zeile über das bessere Scheitern wurde später zum Motto von Künstlern, Sportlern und Gründern."],
  "As Much Truth As One Can Bear": ["1962", "Essay", "Erschienen in der „New York Times Book Review“. Baldwin fordert, dass Schriftsteller der Wahrheit über ihr Land ins Gesicht sehen, gerade wenn sie wehtut."],
  "Strength to Love": ["1963", "Predigtsammlung", "Auf Deutsch „Kraft zum Lieben“. Predigten über Liebe, Gewaltlosigkeit und Mut, entstanden mitten in der Bürgerrechtsbewegung."],
  "The Summer Day": ["1990", "Gedicht", "Oliver beobachtet eine Heuschrecke, die Zucker aus ihrer Hand frisst, und fragt am Ende, was man mit seinem einen wilden, kostbaren Leben anfangen will."],
  "The Writing Life": ["1989", "Essayband", "Dillard schreibt über das Schreiben: über Disziplin, Zweifel und darüber, wie unsere Tage unser Leben ausmachen."],
  "The Left Hand of Darkness": ["1969", "Science-Fiction-Roman", "Auf Deutsch „Die linke Hand der Dunkelheit“. Ein Gesandter besucht den eisigen Planeten Winter, dessen Bewohner kein festes Geschlecht haben. Er gewann die beiden wichtigsten Science-Fiction-Preise."],
  "Rede": ["1981", "Rede", "Aus einer Rede, die Morrison 1981 hielt. Sie erzählte darin, dass sie ihren ersten Roman schrieb, weil es das Buch, das sie lesen wollte, noch nicht gab."],
  "A Burst of Light": ["1988", "Essayband", "Lorde schreibt über ihr Leben mit Krebs und über Selbstfürsorge als politischen Akt für Menschen, die die Gesellschaft übersieht."],
  "Outlaw Culture": ["1994", "Essayband", "Essays über Popkultur, Film, Musik und Liebe. bell hooks verbindet Gesellschaftskritik mit der Frage, wie Liebe Herrschaft überwinden kann."],
  "Contact": ["1985", "Science-Fiction-Roman", "Die Astronomin Ellie Arroway empfängt ein Signal von Außerirdischen. Sagans einziger Roman wurde 1997 mit Jodie Foster verfilmt."],
  "Cargo Cult Science": ["1974", "Rede", "Feynmans Abschlussrede am Caltech. Er warnt vor Forschung, die nur so aussieht wie Wissenschaft, und fordert radikale Ehrlichkeit, vor allem sich selbst gegenüber."]
};

const $ = id => document.getElementById(id);
const DAY = 864e5;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Aura-Stimmungen: Grundton (hell) + vier weiche Farben
const MOODS = [
  ["#f6f1ec", "#ffc6a8", "#d9c2f0", "#f7e1a6", "#f2b8c6"], // Pfirsich & Flieder
  ["#eff0ea", "#b9cfae", "#e8d9b5", "#a9c6c9", "#d6e3c3"], // Salbei & Sand
  ["#f5eff1", "#f2b8c6", "#b8cff2", "#f7d9c4", "#e0c8f0"], // Rosé & Himmel
  ["#f1eff6", "#c8b6f2", "#b6e3d4", "#f2c6e0", "#b9c9f5"], // Flieder & Minze
  ["#f7f0ea", "#f6b38e", "#f2a3b3", "#ffd99a", "#f4c3a1"], // Abendrot
  ["#edf2f5", "#9fc4e6", "#b8e0e0", "#d7c8ee", "#c4d8f2"], // Meer
  ["#f2f2ea", "#c6d8a0", "#f0e2b8", "#a7cdb8", "#e5e7b0"], // Matcha
  ["#f6efe9", "#e9b8a4", "#c9b5a3", "#f1d3b8", "#d8a9a9"]  // Terrakotta & Ton
];

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const order = Q.map((_, i) => i);
(() => { const r = mulberry32(20261117); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } })();
const mod = (n, m) => ((n % m) + m) % m;
const dayKey = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
const dateFor = off => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + off); };

let offset = 0, current = 0;
let favs = store.get("favs", []);
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;

function fitQuote(text) {
  const q = $("quote"), c = $("center");
  const w = c.clientWidth;
  let size = text.length < 60 ? 46 : text.length < 110 ? 38 : text.length < 160 ? 32 : 28;
  size = Math.min(size, w / 7.2);
  q.style.fontSize = size + "px";
  while (c.scrollHeight > c.clientHeight + 1 && size > 18) { size -= 1.5; q.style.fontSize = size + "px"; }
}

function render(animate = true) {
  const d = dateFor(offset), key = dayKey(d);
  current = order[mod(key, order.length)];
  const [text, author, source] = Q[current];
  const m = MOODS[mod(key * 5, MOODS.length)], st = document.documentElement.style;
  ["--c1", "--c2", "--c3", "--c4"].forEach((v, i) => st.setProperty(v, m[i + 1]));
  if (!document.documentElement.dataset.theme && !dark()) st.setProperty("--bg", m[0]); else st.removeProperty("--bg");

  const yday = Math.round((d - new Date(d.getFullYear(), 0, 1)) / DAY) + 1;
  $("day").textContent = d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  $("meta").textContent = "Tag " + yday + (offset === 0 ? " · Heute" : offset === -1 ? " · Gestern" : " · vor " + -offset + " Tagen");
  $("quote").textContent = text;
  $("author").textContent = author;
  $("source").textContent = source;
  fitQuote(text);

  const isFav = favs.includes(current);
  $("fav").setAttribute("aria-pressed", isFav);
  $("heart").setAttribute("fill", isFav ? "currentColor" : "none");
  $("next").disabled = offset >= 0;
  $("today").hidden = offset === 0;
  if (animate) { const c = $("center"); c.classList.remove("fade"); void c.offsetWidth; c.classList.add("fade"); }
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1500); }

function renderFavs() {
  const box = $("favs"); box.innerHTML = "";
  if (!favs.length) { box.innerHTML = '<p class="empty">Noch leer. Tippe beim Zitat auf das Herz, dann sammelt es sich hier.</p>'; return; }
  [...favs].reverse().forEach(idx => {
    const [text, author] = Q[idx];
    const el = document.createElement("article"); el.className = "item";
    el.innerHTML = '<p></p><div class="row"><span></span><button type="button">Entfernen</button></div>';
    el.querySelector("p").textContent = text;
    el.querySelector("span").textContent = author;
    el.querySelector("button").onclick = () => { favs = favs.filter(f => f !== idx); store.set("favs", favs); renderFavs(); render(false); };
    box.appendChild(el);
  });
}

function go(delta) { if (offset + delta > 0) return; offset += delta; render(); }
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("fav").onclick = () => {
  favs = favs.includes(current) ? favs.filter(f => f !== current) : [...favs, current];
  store.set("favs", favs); render(false); toast(favs.includes(current) ? "Gemerkt" : "Entfernt");
};
$("copy").onclick = () => {
  const [text, author] = Q[current], s = "„" + text + "“ – " + author;
  const fail = () => toast("Nicht möglich");
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast("Kopiert"), fail); else fail();
};
$("list").onclick = () => { renderFavs(); $("sheet").hidden = false; $("sheet").scrollTop = 0; };
const closeSheet = () => { $("sheet").hidden = true; };
// Zusätzlich zum Klick direkt auf das Loslassen des Fingers reagieren
function onTap(el, fn) {
  el.addEventListener("click", fn);
  el.addEventListener("touchend", e => { e.preventDefault(); fn(); }, { passive: false });
}
onTap($("close2"), closeSheet);
onTap($("close"), closeSheet);
onTap(document.querySelector(".sheet-head h2"), closeSheet);
// Nach unten wischen schließt die Merkliste
let shy = null;
$("sheet").addEventListener("touchstart", e => { shy = $("sheet").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$("sheet").addEventListener("touchend", e => { if (shy !== null && e.changedTouches[0].clientY - shy > 90) closeSheet(); shy = null; });
const toToday = () => { if (offset !== 0) { offset = 0; render(); } };
$("today").onclick = toToday;
document.querySelector(".date").onclick = toToday;


/* ---------- Infos zu Person und Werk ---------- */
const workKey = src => S[src] ? src : src.split(",")[0].trim();
const chip = t => { const s = document.createElement("span"); s.className = "chip"; s.textContent = t; return s; };
let lastFocus = null;

function openInfo(kind) {
  const [text, author, source] = Q[current];
  const title = $("info-title"), meta = $("info-meta"), more = $("info-more");
  meta.innerHTML = ""; more.innerHTML = "";
  if (kind === "author") {
    const a = A[author];
    $("info-kicker").textContent = "Person";
    title.textContent = author; title.classList.remove("work");
    if (a) { meta.append(chip(a[0]), chip(a[1])); $("info-text").textContent = a[2]; }
    else $("info-text").textContent = "Zu dieser Person sind noch keine Infos hinterlegt.";
    const others = Q.map((q, i) => [q, i]).filter(([q, i]) => q[1] === author && i !== current);
    more.hidden = !others.length;
    if (others.length) {
      const h = document.createElement("h3"); h.textContent = others.length === 1 ? "Ein weiterer Gedanke" : others.length + " weitere Gedanken"; more.append(h);
      others.forEach(([q]) => {
        const b = document.createElement("div"); b.className = "more-q";
        b.textContent = q[0]; const s = document.createElement("span"); s.textContent = q[2]; b.append(s); more.append(b);
      });
    }
  } else {
    const w = S[workKey(source)];
    $("info-kicker").textContent = "Werk";
    const shown = source.replace(/^nach Platon, /, "").replace(/^zu Alexander dem Großen.*/, "Anekdote über Alexander");
    title.textContent = shown; title.classList.add("work");
    meta.append(chip(author));
    if (w) { if (w[0]) meta.append(chip(w[0])); meta.append(chip(w[1])); $("info-text").textContent = w[2]; }
    else $("info-text").textContent = "Zu diesem Werk sind noch keine Infos hinterlegt.";
    more.hidden = true;
  }
  lastFocus = document.activeElement;
  $("info").hidden = false;
  $("info").querySelector(".info-card").scrollTop = 0;
  $("info-close").focus({ preventScroll: true });
}
function closeInfo() { $("info").hidden = true; lastFocus?.focus?.({ preventScroll: true }); }
$("author").onclick = () => openInfo("author");
$("source").onclick = () => openInfo("work");
$("info-close").onclick = closeInfo;
$("info-backdrop").onclick = closeInfo;
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("info").hidden) closeInfo(); else if (!$("sheet").hidden) closeSheet(); } });

// Nach unten wischen schließt die Karte
let iy = null;
$("info").addEventListener("touchstart", e => { const c = $("info").querySelector(".info-card"); iy = c.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$("info").addEventListener("touchend", e => { if (iy !== null && e.changedTouches[0].clientY - iy > 80) closeInfo(); iy = null; });

let sx = null, sy = null;
$("stage").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("stage").addEventListener("touchend", e => {
  if (sx === null || !$("info").hidden) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx > 0 ? -1 : 1);
  sx = null;
});

let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(false), 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => render(false));
let lastKey = dayKey(new Date());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && dayKey(new Date()) !== lastKey) { lastKey = dayKey(new Date()); offset = 0; render(); }
});
document.fonts?.ready.then(() => render(false));
render();

/* ---------- Updates ---------- */
const APP_VERSION = "7";
$("version").textContent = "Version " + APP_VERSION;
async function checkUpdate() {
  if (location.protocol !== "https:") return;
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) location.reload();
  } catch {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
</script>

</body>
